server {
    listen 80;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /radar {
        return 301 /radar/;
    }

    location ^~ /radar/assets/ {
        alias /usr/share/nginx/html/radar/assets/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /radar/ {
        alias /usr/share/nginx/html/radar/;
        index index.html;
        try_files $uri $uri/ /radar/index.html;
    }

    location / {
        return 404;
    }
}
