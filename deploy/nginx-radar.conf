# Include inside your HTTPS / domain-matched server {} block in Nginx
# (for example /etc/nginx/sites-available/freeroadtosea.site.conf).

# 1. Redirect exact /radar to /radar/
location = /radar {
    return 301 https://$host/radar/;
}

# 2. SSE streaming chat & progressive crawl endpoints (proxy buffering disabled + long idle timeout)
location ^~ /radar/api/chat/ {
    rewrite ^/radar/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location = /radar/api/jobs/crawl/stream {
    rewrite ^/radar/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# 3. Standard REST API reverse proxy
location ^~ /radar/api/ {
    rewrite ^/radar/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
}

# 4. Fingerprinted frontend build assets (long cache)
location ^~ /radar/assets/ {
    alias /home/liu/trendradar/frontend-dist/assets/;
    expires 7d;
    add_header Cache-Control "public, immutable";
}

# 5. React SPA static host with History API fallback
location ^~ /radar/ {
    alias /home/liu/trendradar/frontend-dist/;
    index index.html;
    try_files $uri $uri/ /radar/index.html;
}
