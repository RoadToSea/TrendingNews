[project]
name = "trendradar-backend"
version = "0.1.0"
description = "TrendRadar Self-Hosted Web Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "apscheduler>=3.10.4,<4.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=44.0.0",
    "itsdangerous>=2.2.0",
    "httpx>=0.28.0",
    "openai>=1.60.0",
    "anthropic>=0.45.0",
    "requests>=2.32.0",
    "pyyaml>=6.0.2",
    "feedparser>=6.0.12",
    "pytz>=2025.1",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
